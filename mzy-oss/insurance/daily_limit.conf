# ============================================================
# daily_limit.conf —— 五件保险之二【日限额+熔断】的配置件
# 版权许可：SPDX-License-Identifier: Apache-2.0（全文见 LICENSE）
#
# 核心就一行：日限额数字（单位：token/日）。
# 下面的 CHECK_* 是给 doctor.sh 体检用的可选行，不写不影响熔断。
# 格式规矩：
#   - 限额行：纯数字（可写成 DAILY_LIMIT=数字 或裸数字），必须 > 0
#   - 注释行：# 开头；空行忽略
#   - 单位是 token/日——填 100 就是每天 100 token，不是 100 万
# 用法示例：把本文件放在 fuse.sh 同目录，或用环境变量 FUSE_CONF 指路。
# ============================================================

# 日限额（token/日）。示例 100000 = 小团队一天十万 token。
DAILY_LIMIT=100000

# —— 以下可选：doctor.sh 体检项 ——
# 要检查存在性的路径（逗号分隔，相对本文件目录）
CHECK_PATH=./usage_meter.sh,./usage_report.sh,./fuse.sh,./sentinel.sh,./circuit.sh,./doctor.sh
# 要检查可达性的端口（host:port 逗号分隔；没服务就删掉这行）
# CHECK_PORT=127.0.0.1:8080
